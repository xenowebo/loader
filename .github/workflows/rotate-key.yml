name: Rotate Xen0 Weekly Key

on:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and publish key
        id: paste
        shell: bash
        env:
          PASTEBIN_API_KEY: ${{ secrets.PASTEBIN_API_KEY }}
        run: |
          set -euo pipefail

          KEY="xen0-$(python3 -c 'import secrets; print(secrets.token_hex(8))')"

          RESPONSE=$(curl --fail --silent --show-error \
            --data-urlencode "api_dev_key=$PASTEBIN_API_KEY" \
            --data-urlencode "api_option=paste" \
            --data-urlencode "api_paste_code=$KEY" \
            --data-urlencode "api_paste_name=Xen0 Weekly Key" \
            --data-urlencode "api_paste_private=1" \
            --data-urlencode "api_paste_expire_date=N" \
            https://pastebin.com/api/api_post.php)

          if [[ ! "$RESPONSE" =~ ^https://pastebin\.com/([A-Za-z0-9]+)$ ]]; then
            echo "Pastebin error: $RESPONSE"
            exit 1
          fi

          echo "raw_url=https://pastebin.com/raw/${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Update latest key URL
        uses: actions/github-script@v7
        env:
          PASTE_URL: ${{ steps.paste.outputs.raw_url }}
        with:
          script: |
            const path = "current-key-url.txt";
            let sha;

            try {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "loader"
              });
              sha = file.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "Rotate Xen0 weekly key",
              content: Buffer.from(process.env.PASTE_URL + "\n").toString("base64"),
              branch: "loader",
              ...(sha ? { sha } : {})
            });
